name: Build QMK Firmware

on:
  workflow_call:
    inputs:
      keyboard:
        required: true
        type: string
      keymap:
        required: true
        type: string
      side:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned: an unpinned (:latest) image changes under us with no commit, which is
    # how the sibling vial-qmk release workflow broke twice. Bump deliberately.
    container: ghcr.io/qmk/qmk_cli:1.2.0@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a

    steps:
    - name: Checkout code - Non PR
      uses: actions/checkout@v4
      if: ${{ startsWith(github.ref, 'refs/tags') }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.ref }}
        fetch-depth: 0
        submodules: 'recursive'

    - name: Checkout code - PR
      uses: actions/checkout@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        submodules: 'recursive'

    - name: Get tag version
      if: ${{ startsWith(github.ref, 'refs/tags/')}}
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: Build firmware
      id: build_firmware
      run: |
        git config --global --add safe.directory '*'
        # Install into the image's qmk virtualenv (/opt/uv/tools/qmk, Python 3.14) --
        # the interpreter the qmk CLI and every build step actually use. Addressing it
        # as python3 -m pip does not depend on which pip3 shim wins on PATH, and needs
        # no --break-system-packages because a venv is not PEP 668 managed.
        python3 -m pip install -r requirements.txt
        qmk setup -y
        make ${{ inputs.keyboard }}/${{ inputs.side }}:${{ inputs.keymap }}
      shell: bash

    - name: Calculate keyboard name
      id: keyboard_vars
      run: |
        KEYBOARD_NAME="${{ inputs.keyboard }}"
        KEYBOARD_NAME="${KEYBOARD_NAME//\//_}"
        echo "keyboard_name=$KEYBOARD_NAME" >> $GITHUB_ENV
        echo "keyboard_name=$KEYBOARD_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Add file to PR.
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2
        path: ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2

    - name: Move file into position (for tags only)
      id: move_file
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        FILE_NAME="${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}_${{ steps.get_version.outputs.VERSION }}.uf2"
        mv ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2 "$FILE_NAME"
        echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Release
      uses: ncipollo/release-action@v1.11.2
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        allowUpdates: True
        artifacts: "${{ steps.move_file.outputs.file_name }}"
